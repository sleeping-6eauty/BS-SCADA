spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
debug=false
spring.thymeleaf.check-template-location=false

spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bs_scada}?serverTimezone=Asia/Seoul&characterEncoding=utf8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=bs-scada-mysql-pool
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${MYSQL_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${MYSQL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${MYSQL_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.connection-test-query=SELECT 1

spring.sql.init.mode=${SQL_INIT_MODE:never}
mybatis.configuration.map-underscore-to-camel-case=true

jwt.secret=bs-scada-super-secret-jwt-key-for-hmac-sha256-2026
jwt.expiration-ms=86400000